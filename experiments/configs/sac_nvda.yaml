# SAC Configuration for NVDA Trading
# RLpaca Project - Algorithm Comparison Study

algorithm: SAC
version: "1.0"

# Environment
environment:
  symbol: NVDA
  state_dim: 14548
  action_dim: 2
  tick_window: 500
  bar_window: 780  # 13 hours * 60 minutes
  action_history: 1560

# Network Architecture
policy:
  type: stochastic
  hidden_layers: [256, 256]
  activation: relu
  log_std_min: -20
  log_std_max: 2

critic:
  type: twin  # Two Q-networks
  hidden_layers: [256, 256]
  activation: relu

# Training
training:
  total_timesteps: 100000
  learning_rate: 0.0003
  batch_size: 256
  buffer_size: 1000000
  learning_starts: 10000
  tau: 0.005
  gamma: 0.99

# SAC-specific
entropy:
  auto_tune: true
  target_entropy: auto  # -dim(A)
  initial_alpha: 0.2

# Data
data:
  train_start: "2020-01-01"
  train_end: "2024-12-31"
  test_start: "2025-01-01"
  test_end: "2025-03-31"

# Constraints
constraints:
  long_only: true
  max_position: 1.0
  min_trade_size: 0.01
